# Paper Trading Lab configuration.
# Validated at load time by src/paper_lab/config.py (pydantic, unknown keys rejected).
# Any change that alters strategy behaviour must reference an experiment id (EXP-NNN)
# in the commit message. See docs/decisions.md for the reasoning behind each default.

project:
  name: paper-lab
  paper_only: true          # must stay true; the loader refuses anything else

paths:
  data_cache: data
  data_archive: data_archive
  journal: journal
  reports: reports
  experiments: experiments
  logs: logs

logging:
  level: INFO
  file: paper_lab.log
  max_bytes: 5000000        # rotate at ~5 MB
  backup_count: 5

instruments:
  - symbol: GC=F
    role: primary
    description: COMEX gold futures, continuous front month (yfinance)
    contract_multiplier: 100   # USD per 1.00 move = 100 oz per contract
    price_unit: USD/oz
    prepost: false             # irrelevant for futures (Yahoo returns the full Globex day)
    data_delay_min: 20         # COMEX on Yahoo is ~10 min delayed; recent volume also gets revised
    trading_hours: {start: "18:00", end: "17:00"}   # ET, wraps midnight; 17:00-18:00 = daily break
  - symbol: GLD
    role: cross_check
    description: SPDR Gold Shares ETF (yfinance)
    contract_multiplier: 1     # one share
    price_unit: USD/share
    prepost: false             # regular hours only; pre/post bars are mostly zero-volume
    data_delay_min: 20         # live GLD volume is re-attributed between bars for ~15 min
    trading_hours: {start: "09:30", end: "16:00"}

data:
  source: yfinance
  archive_intervals: ["1m", "5m", "1h"]
  storage_format: parquet      # falls back to csv if pyarrow is unavailable
  # Yahoo limits observed on 2026-11-09 (docs/data_notes.md). lookback stays one day
  # inside the hard limit; chunk_days respects the per-request cap (1m: 8 days).
  limits:
    1m: {lookback_days: 29, chunk_days: 7}
    5m: {lookback_days: 59, chunk_days: 30}
    1h: {lookback_days: 729, chunk_days: 180}
  update_overlap_days: 3       # re-fetch this much before the last archived bar
  incomplete_bar_grace_sec: 120  # drop bars that ended less than this before the fetch
  request_pause_sec: 1.0
  max_retries: 3

validation:
  atr_window: 20               # bars, for the "absurd candle" check
  absurd_range_atr_mult: 8.0   # range > mult x ATR is flagged
  gap_check_max_interval_min: 30   # in-session gap check only for bars <= 30 min

session:
  timezone: America/New_York
  start: "09:30"
  end: "12:00"
  exchange_calendar: XNYS      # holidays / early closes

risk:
  paper_capital_usd: 100000
  risk_per_trade_pct: 0.5
  daily_loss_limit_pct: 1.5
  max_trades_per_day: 2
  max_stops_per_day: 3         # "3 stops = day is over"

calendar:
  # Official release dates, one row per event with its source URL (docs/data_notes.md).
  events_files:
    - data/calendar/events_2026.csv
    - data/calendar/events_2027.csv

news_guard:
  mode: open_guard             # off | open_guard  (run both to measure the filter's effect)
  open_guard_min: 30           # no new entries in the first N session minutes after a morning release
  morning_events: [CPI, NFP]   # released 08:30 ET, before the 09:30 open
  in_session_window_min: 15    # +/- window for an event released during the session (none today)

# Setups: one module each in src/paper_lab/setups/. Params are validated by each setup's own
# schema. Defaults were fixed on 2026-11-09 WITHOUT looking at results (docs/decisions.md);
# any change must reference a pre-registered experiment (EXP-NNN) in the commit message.
setups:
  orb:
    enabled: true
    interval: 5m
    params:
      or_minutes: 15             # opening range = first N session minutes
      k: 2.0                     # target = k x risk (risk measured from the actual fill)
      stop_fraction: 1.0         # 1.0 = stop at the opposite side of the range
      min_range_atr: 0.10        # skip days whose range / ATR(14 daily) is below this ...
      max_range_atr: 0.60        # ... or above this (both inclusive bounds)
      atr_days: 14
      volume_mult: 1.2           # breakout bar volume >= mult x same-time average; 0 = off
      volume_lookback_sessions: 10
      volume_min_sessions: 5     # fewer prior samples -> no signal (fail safe)
      last_entry: "11:30"        # ET; no new signals after this bar close
      max_signals_per_day: 1
  momentum:
    enabled: false               # disabled until an experiment for it is approved
    interval: 5m
    params:
      first_window_minutes: 60   # "first hour"
      move_pct: 0.40             # |close - open| / open over the first hour, in %
      anchor: vwap               # vwap | ema
      ema_length: 20
      k: 2.0
      stop_buffer_atr: 0.0       # extra distance beyond the pullback extreme, in daily ATR
      atr_days: 14
      last_entry: "11:30"
      max_signals_per_day: 1
