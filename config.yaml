# Paper Trading Lab configuration.
# Validated at load time by src/paper_lab/config.py (pydantic, unknown keys rejected).
# Any change that alters strategy behaviour must reference an experiment id (EXP-NNN)
# in the commit message. See docs/decisions.md for the reasoning behind each default.

project:
  name: paper-lab
  paper_only: true          # must stay true; the loader refuses anything else

paths:
  data_cache: data
  data_archive: data_archive
  journal: journal
  reports: reports
  experiments: experiments
  logs: logs

logging:
  level: INFO
  file: paper_lab.log
  max_bytes: 5000000        # rotate at ~5 MB
  backup_count: 5

instruments:
  - symbol: GC=F
    role: primary
    description: COMEX gold futures, continuous front month (yfinance)
    contract_multiplier: 100   # USD per 1.00 move = 100 oz per contract
    price_unit: USD/oz
    prepost: false             # irrelevant for futures (Yahoo returns the full Globex day)
    data_delay_min: 20         # COMEX on Yahoo is ~10 min delayed; recent volume also gets revised
    trading_hours: {start: "18:00", end: "17:00"}   # ET, wraps midnight; 17:00-18:00 = daily break
  - symbol: GLD
    role: cross_check
    description: SPDR Gold Shares ETF (yfinance)
    contract_multiplier: 1     # one share
    price_unit: USD/share
    prepost: false             # regular hours only; pre/post bars are mostly zero-volume
    data_delay_min: 20         # live GLD volume is re-attributed between bars for ~15 min
    trading_hours: {start: "09:30", end: "16:00"}

data:
  source: yfinance
  archive_intervals: ["1m", "5m", "1h"]
  storage_format: parquet      # falls back to csv if pyarrow is unavailable
  # Yahoo limits observed on 2026-11-09 (docs/data_notes.md). lookback stays one day
  # inside the hard limit; chunk_days respects the per-request cap (1m: 8 days).
  limits:
    1m: {lookback_days: 29, chunk_days: 7}
    5m: {lookback_days: 59, chunk_days: 30}
    1h: {lookback_days: 729, chunk_days: 180}
  update_overlap_days: 3       # re-fetch this much before the last archived bar
  incomplete_bar_grace_sec: 120  # drop bars that ended less than this before the fetch
  request_pause_sec: 1.0
  max_retries: 3

validation:
  atr_window: 20               # bars, for the "absurd candle" check
  absurd_range_atr_mult: 8.0   # range > mult x ATR is flagged
  gap_check_max_interval_min: 30   # in-session gap check only for bars <= 30 min

session:
  timezone: America/New_York
  start: "09:30"
  end: "12:00"
  exchange_calendar: XNYS      # holidays / early closes

risk:
  paper_capital_usd: 100000
  risk_per_trade_pct: 0.5
  daily_loss_limit_pct: 1.5
  max_trades_per_day: 2
  max_stops_per_day: 3         # "3 stops = day is over"
  max_notional_multiple: 1.0   # position value <= 1.0 x capital: no leverage (conservative)

calendar:
  # Official release dates, one row per event with its source URL (docs/data_notes.md).
  events_files:
    - data/calendar/events_2026.csv
    - data/calendar/events_2027.csv

news_guard:
  mode: open_guard             # off | open_guard  (run both to measure the filter's effect)
  open_guard_min: 30           # no new entries in the first N session minutes after a morning release
  morning_events: [CPI, NFP]   # released 08:30 ET, before the 09:30 open
  in_session_window_min: 15    # +/- window for an event released during the session (none today)

# Setups: one module each in src/paper_lab/setups/. Params are validated by each setup's own
# schema. Defaults were fixed on 2026-11-09 WITHOUT looking at results (docs/decisions.md);
# any change must reference a pre-registered experiment (EXP-NNN) in the commit message.
setups:
  orb:
    enabled: true
    interval: 5m
    params:
      or_minutes: 15             # opening range = first N session minutes
      k: 2.0                     # target = k x risk (risk measured from the actual fill)
      stop_fraction: 1.0         # 1.0 = stop at the opposite side of the range
      min_range_atr: 0.10        # skip days whose range / ATR(14 daily) is below this ...
      max_range_atr: 0.60        # ... or above this (both inclusive bounds)
      atr_days: 14
      volume_mult: 1.2           # breakout bar volume >= mult x same-time average; 0 = off
      volume_lookback_sessions: 10
      volume_min_sessions: 5     # fewer prior samples -> no signal (fail safe)
      last_entry: "11:30"        # ET; no new signals after this bar close
      max_signals_per_day: 1
  momentum:
    enabled: false               # disabled until an experiment for it is approved
    interval: 5m
    params:
      first_window_minutes: 60   # "first hour"
      move_pct: 0.40             # |close - open| / open over the first hour, in %
      anchor: vwap               # vwap | ema
      ema_length: 20
      k: 2.0
      stop_buffer_atr: 0.0       # extra distance beyond the pullback extreme, in daily ATR
      atr_days: 14
      last_entry: "11:30"
      max_signals_per_day: 1

# Execution costs per instrument. Sources and reasoning: docs/cost_model.md (each number is
# marked `sourced` or `assumption` there). GC=F prices are traded as Micro Gold (MGC, 10 oz):
# a full 100 oz GC contract cannot be sized to a 0.5% risk budget (decision 2026-11-09).
# GC costs must never be applied to GLD: each instrument has its own block.
costs:
  GC=F:
    kind: future
    trade_as: MGC
    multiplier: 10                 # oz per MGC contract (CME, sourced)
    tick_size: 0.10                # USD/oz = $1.00 per contract (CME, sourced)
    commission_per_contract: 0.96  # per side: IBKR 0.25 + COMEX 0.70 + regulatory 0.01 (sourced)
    half_spread_ticks: 0.5         # assumption: 1-tick spread during the NY session
    slippage_ticks: 1.0            # assumption: market entry / time exit
    stop_slippage_ticks: 2.0       # assumption: stop orders fill in moving markets
  GLD:
    kind: stock
    tick_size: 0.01
    commission_per_share: 0.005    # IBKR Pro Fixed (sourced)
    commission_min: 1.00           # per order (sourced)
    commission_max_pct: 1.0        # % of trade value (sourced)
    sec_fee_rate: 0.0000206        # x value of sales (sourced via IBKR)
    cat_fee_per_share: 0.000003    # FINRA CAT, per share each side (sourced via IBKR)
    half_spread_ticks: 0.5         # assumption: 1-cent spread
    slippage_ticks: 1.0            # assumption
    stop_slippage_ticks: 2.0       # assumption

# Slippage is higher at the open and on news (spec Stage D). Multipliers apply to the
# slippage part only (not spread or commission); when both apply, the larger one is used.
execution:
  open_minutes: 15                 # first minutes of the session
  open_slippage_mult: 2.0          # assumption
  event_minutes: 60                # on morning-release days: first minutes of the session
  event_slippage_mult: 3.0         # assumption

# Research windows and statistics (Stage E). Decision 2026-11-09 (Nick): in-sample = the
# archive collected so far; out-of-sample = trading days from 2026-11-09 on, which did not
# exist when the rules were written. OOS is opened at most once per experiment
# (experiments/oos_access.csv) and never used for choosing parameters.
analysis:
  in_sample: {start: "2026-09-11", end: "2026-11-06"}
  out_of_sample: {start: "2026-11-09", end: "2027-12-31"}
  bootstrap_samples: 10000
  bootstrap_seed: 20261109
  ci_level: 0.95
  insufficient_below: 30         # < 30 trades: "insufficient sample"
  usable_above: 100              # 30-100: "weak evidence"; > 100: "usable"

# Stage F: daily forward paper loop. Operational settings, not part of the strategy hash:
# the strategy itself (setups, risk, costs) is fixed above and pinned by the experiments.
forward:
  start: "2026-11-09"            # first forward session = first out-of-sample day
  # Mac local times (launchd, Europe/Copenhagen). The ET session ends 12:00 = 18:00 local
  # (17:00 in the US/EU DST mismatch weeks); +45 min for Yahoo's delay. A missed time
  # (Mac asleep) runs on wake; a powered-off Mac catches up at login (RunAtLoad).
  schedule_local: ["18:45", "21:30"]
  alarm_min_trades: 20           # spec F.3: alarm evaluated from 20 forward trades on
  alarm_expectancy_r: -0.10      # ... when forward expectancy is below this
  baseline_experiment: EXP-001   # backtest the forward results are compared with
  baseline_dir: reports/backtest_2026-11-09_EXP-001
